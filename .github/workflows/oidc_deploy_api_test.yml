name: OIDC Deploy API Test v2
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OIDC + deploy-api
        run: |
          # Get OIDC token
          RESP=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange")
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "Token obtained (length): ${#TOKEN}"
          
          # Decode claims
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAD=$((4 - ${#PAYLOAD} % 4))
          [ $PAD -ne 4 ] && PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"
          echo "Claims:"
          echo "$PAYLOAD" | base64 -d | python3 -m json.tool
          
          # Test deploy-api-ang
          echo ""
          echo "=== deploy-api-ang.githubapp.com ==="
          curl -sk -o /dev/null -w "Status: %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://deploy-api-ang.githubapp.com/"
          curl -sk -w "\nBody: %{response_code}\n" -H "Authorization: Bearer $TOKEN" "https://deploy-api-ang.githubapp.com/" 2>&1 | head -5
          
          echo ""
          echo "=== deploy-api-ash1.githubapp.com ==="
          curl -sk -o /dev/null -w "Status: %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://deploy-api-ash1.githubapp.com/"
          
          echo ""
          echo "=== heaven.githubapp.com ==="
          curl -sk -o /dev/null -w "Status: %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://heaven.githubapp.com/"
          
          echo ""
          echo "=== ops.githubapp.com ==="
          curl -sk -o /dev/null -w "Status: %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://ops.githubapp.com/"
          
          echo ""
          echo "=== janky.githubapp.com ==="
          curl -sk -o /dev/null -w "Status: %{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://janky.githubapp.com/"
