name: OIDC Internal Services Test
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OIDC with service-specific audiences
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, os, ssl
          
          ctx = ssl.create_default_context()
          oidc_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          oidc_req_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          
          def get_token(audience):
              url = oidc_url + f"&audience={audience}"
              r = urllib.request.Request(url, headers={"Authorization": f"bearer {oidc_req_token}"})
              with urllib.request.urlopen(r, context=ctx, timeout=10) as resp:
                  return json.loads(resp.read())["value"]
          
          def fetch(url, token):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=10) as r:
                      body = r.read(1000).decode("utf-8", errors="replace")
                      return r.status, body
              except urllib.error.HTTPError as e:
                  body = e.read(500).decode("utf-8", errors="replace")
                  return e.code, body
              except Exception as e:
                  return 0, str(e)
          
          # Test with different audiences for each service
          services = [
              ("skeefree-production-ang.githubapp.com", "/"),
              ("skeefree-production-ang.githubapp.com", "/api/v1/services"),
              ("vulnerability-aggregator-production-ang.githubapp.com", "/"),
              ("ospo-policy-service-production-ang.githubapp.com", "/"),
          ]
          
          audiences = [
              "https://github.com",
              "skeefree-production-ang.githubapp.com",
              "*.githubapp.com",
              "githubapp.com",
              "api://AzureADTokenExchange",
              "https://token.actions.githubusercontent.com",
          ]
          
          for audience in audiences:
              print(f"\n--- Audience: {audience} ---")
              try:
                  token = get_token(audience)
                  print(f"  Token obtained (len={len(token)})")
                  # Test one service
                  host, path = services[0]
                  status, body = fetch(f"https://{host}{path}", token)
                  print(f"  skeefree/: HTTP {status} - {body[:200]}")
              except Exception as e:
                  print(f"  Failed to get token: {e}")
          
          PYEOF
